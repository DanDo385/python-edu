[pytest]
# ==============================================================================
# Python-50x-Minis Pytest Configuration
# ==============================================================================

# Minimum Python version
minversion = 7.3

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .
# pytest will recursively find all test_*.py files in project-*/test/ directories

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config errors)
    --strict-config
    # Warnings
    -W default
    # Show durations of slowest tests
    --durations=10
    # Coverage (commented out by default for speed)
    # --cov=.
    # --cov-report=html
    # --cov-report=term-missing
    # Parallel execution (commented out by default)
    # -n auto

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    phase1: Phase I tests (Python basics, DSA)
    phase2: Phase II tests (NumPy, ML math)
    phase3: Phase III tests (PyTorch)
    phase4: Phase IV tests (Transformers, LLMs)
    gpu: marks tests that require GPU
    network: marks tests that require network access
    expensive: marks computationally expensive tests
    property: marks property-based tests (Hypothesis)

# Test collection ignore patterns
norecursedirs =
    .git
    .tox
    .env
    .venv
    venv
    env
    __pycache__
    *.egg-info
    dist
    build
    docs
    .ipynb_checkpoints
    node_modules

# Ignore specific directories (existing projects that don't follow new structure)
# These are the old 01-10 projects before restructure
collect_ignore =
    01-dynamic-typing-basics
    02-list-comprehensions
    03-decorators-metaprogramming
    04-context-managers
    05-exception-handling
    06-classes-magic-methods
    07-web-scraping
    08-data-analysis-pandas
    09-rest-api-flask
    10-automation-scripting

# Doctest configuration
doctest_optionflags =
    NORMALIZE_WHITESPACE
    ELLIPSIS

# Timeout for tests (in seconds)
# timeout = 300  # Uncomment to enable global timeout

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filterwarnings
filterwarnings =
    # Convert warnings to errors (strict mode)
    # error
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # PyTorch-specific warnings to ignore
    ignore:.*torch\..*:UserWarning

# Coverage configuration (when enabled)
[coverage:run]
source = .
omit =
    */test/*
    */tests/*
    *_test.py
    test_*.py
    setup.py
    */site-packages/*
    */.venv/*
    */venv/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov

# ==============================================================================
# Usage Examples
# ==============================================================================
# Run all tests:
#   pytest
#
# Run tests for specific phase:
#   pytest -m phase1
#   pytest -m "phase2 or phase3"
#
# Run tests excluding slow ones:
#   pytest -m "not slow"
#
# Run tests with coverage:
#   pytest --cov=. --cov-report=html
#
# Run tests in parallel (requires pytest-xdist):
#   pytest -n auto
#
# Run specific project tests:
#   pytest project-01-basic-python-syntax/test/
#
# Run with verbose output and show print statements:
#   pytest -v -s
#
# Run only failed tests from last run:
#   pytest --lf
#
# Run tests and stop at first failure:
#   pytest -x
#
# Run tests matching pattern:
#   pytest -k "test_addition"
#
# Run tests with profiling:
#   pytest --profile
#
# Generate JUnit XML (for CI):
#   pytest --junitxml=junit.xml
